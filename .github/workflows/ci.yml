name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - name: Check apps
        run: for app in apps/*/*/; do echo "== $app"; (cd $app && cargo check --all-targets); done
      - name: Test apps
        run: for app in apps/*/*/; do echo "== $app"; (cd $app && cargo test); done

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - app: taskboard
            dir: apps/fullstack/taskboard
          - app: blog
            dir: apps/fullstack/blog
          - app: pastebin
            dir: apps/fullstack/pastebin
          - app: pulse
            dir: apps/fullstack/pulse
          - app: registry
            dir: apps/api/registry
          - app: todo
            dir: apps/api/todo
          - app: hooks
            dir: apps/api/hooks
          - app: notifier
            dir: apps/api/notifier
          - app: shortlink
            dir: apps/api/shortlink
          - app: echo
            dir: apps/serverless/echo
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.app }} image
        run: docker build -t ${{ matrix.app }} ${{ matrix.dir }}
